<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="Rukia.JPG">
    
    <!-- Configuracion del juego de caracteres y diseño adaptable para moviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Titulo de la pagina en la pestaña del navegador -->
    <title>Diego Garza</title>
    
    <style>
        /* Estilos generales de la pagina */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
        }

        /* Estilos y efectos visuales de la imagen */
        .imagen-centrada {
            max-width: 80%;
            max-height: 80vh;
            border-radius: 0px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            filter: grayscale(100%) contrast(120%); 
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        /* Estilos para el texto inferior */
        .caption {
            margin-top: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #008000;
            letter-spacing: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Imagen principal centrada en la pantalla -->
    <img class="imagen-centrada" src="Heisenberg.JPG" alt="Diego Garza">

    <!-- Bloque de texto con el nombre debajo de la imagen -->
    <div class="caption">
        Diego Garza
    </div>
</body>
</html>
